<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5StickC BLE PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; background: #f4f6f9; color: #333; }
        button { padding: 12px 20px; font-size: 15px; margin: 5px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-connect { background: #007bff; color: white; }
        .btn-on { background: #28a745; color: white; }
        .btn-off { background: #dc3545; color: white; }
        .btn-spin { background: #f39c12; color: white; font-size: 18px; padding: 12px 30px; width: 80%; max-width: 250px; }
        .btn-spin:disabled { background: #ccc; cursor: not-allowed; }
        .btn-upgrade { background: #8e44ad; color: white; font-size: 13px; padding: 8px 12px; margin-top: 5px; }
        .btn-upgrade:disabled { background: #bbb; }

        #status { font-weight: bold; margin-top: 15px; color: #666; }

        .card {
            background: #fff; border-radius: 12px; padding: 15px; margin: 15px auto;
            max-width: 340px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .point-val { font-size: 32px; color: #e67e22; font-weight: bold; }
        .timer-val { font-size: 18px; color: #555; margin-top: 5px; }

        /* ノルマ表示エリア */
        .stage-box {
            background: #eef6ff; border: 1px solid #b6d4fe; border-radius: 8px;
            padding: 10px; margin-bottom: 10px; font-size: 14px;
        }

        /* スロットエリア */
        .slot-container {
            display: flex; justify-content: center; gap: 10px; font-size: 45px;
            background: #222; padding: 15px; border-radius: 10px; margin: 10px 0; color: #fff;
            transition: background 0.3s;
        }
        /* スロット枠（固定） */
.slot-reel {
    width: 70px;
    height: 70px;
    line-height: 70px;
    background: #333;
    border-radius: 8px;
    border: 2px solid #555;
    position: relative;
    overflow: hidden; /* 枠からはみ出た絵柄を隠す */
}

/* 枠の中で動く絵柄用インナー要素 */
.reel-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* スピン中のアニメーション（絵柄だけを動かす） */
@keyframes spinSymbol {
    0% { transform: translateY(-100%); opacity: 0.3; }
    50% { opacity: 0.8; }
    100% { transform: translateY(100%); opacity: 0.3; }
}

/* spinning クラスは中の .reel-inner に付与する */
.spinning {
    animation: spinSymbol 0.08s linear infinite;
}

        /* スピン中のアニメーション */
        @keyframes spinReel {
            0% { transform: translateY(-100%); opacity: 0.5; }
            100% { transform: translateY(100%); opacity: 0.5; }
        }
        .spinning { animation: spinReel 0.1s linear infinite; }

        /* 大当たりアニメーション演出 */
        @keyframes jackpotFlash {
            0% { background-color: #222; }
            50% { background-color: #f1c40f; }
            100% { background-color: #222; }
        }
        .flash-effect { animation: jackpotFlash 0.5s 3; }

        /* アップグレード グリッド */
        .upgrade-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .upgrade-item {
            background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px;
            padding: 10px; text-align: left; font-size: 13px;
        }
    </style>
</head>
<body>

    <h2>M5StickC Focus Tracker</h2>

    <button class="btn-connect" id="connectBtn">M5Stackに接続</button>
    <br>
    <button class="btn-on" id="ledOnBtn" disabled>LED 点灯</button>
    <button class="btn-off" id="ledOffBtn" disabled>LED 消灯</button>

    <div id="status">ステータス: 未接続</div>

    <!-- メイン実績＆タイマー -->
    <div class="card">
        <div style="font-size:12px; color:#888;">累計フォーカス実績</div>
        <div class="point-val" id="pointDisplay">0 PT</div>
        <div class="timer-val" id="timerDisplay">経過時間: 00:00</div>
    </div>

    <!-- ミニゲーム：ローグライクスロット -->
    <div class="card" style="border: 2px solid #f39c12;">
        <h3 style="margin: 0 0 10px 0; color: #d35400;">🎰 Focus Slot</h3>

       <!-- ステージ・ミッション情報 -->
        <div class="stage-box">
            <div><b>ステージ: <span id="stageDisplay">1</span></b></div>
            <div style="margin: 4px 0; color: #d35400;">
                <b>🎯 ミッション: <span id="missionTextDisplay">---</span></b>
            </div>
            <div>進捗: <b id="missionProgressDisplay" style="color:#27ae60;">0 / 0</b></div>
            <div>残りスピン回数: <b id="spinsLeftDisplay" style="color:#2980b9;">5</b> 回</div>
        </div>

        <div>所持チケット: <b id="ticketDisplay" style="color:#e67e22; font-size:18px;">0</b> 枚</div>
        <div>所持コイン: <b id="coinDisplay" style="color:#f1c40f; font-size:18px;">0</b> C</div>

       <div class="slot-container" id="slotContainer">
    <div class="slot-reel"><span class="reel-inner" id="reel1">❓</span></div>
    <div class="slot-reel"><span class="reel-inner" id="reel2">❓</span></div>
    <div class="slot-reel"><span class="reel-inner" id="reel3">❓</span></div>
</div>

        <button class="btn-spin" id="spinBtn" disabled>スピン (1枚消費)</button>
        <div id="slotMsg" style="margin-top: 8px; font-weight: bold; min-height: 20px;"></div>

        <!-- ローグライク補正（アップグレード） -->
        <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
        <div style="font-weight:bold; font-size:14px;">🛠️ スロット強化（コイン消費）</div>
        
        <div class="upgrade-grid">
            <div class="upgrade-item">
                <div><b>配当倍率 UP</b> (Lv: <span id="lvMultiplier">1</span>)</div>
                <div style="color:#666;">獲得コイン量が増加します</div>
                <button class="btn-upgrade" id="upMultiplierBtn">強化 (<span id="costMultiplier">10</span> C)</button>
            </div>
            <div class="upgrade-item">
                <div><b>レア絵柄率 UP</b> (Lv: <span id="lvLuck">1</span>)</div>
                <div style="color:#666;">🔔 や 💎 が揃いやすくなります</div>
                <button class="btn-upgrade" id="upLuckBtn">強化 (<span id="costLuck">15</span> C)</button>
            </div>
            <div class="upgrade-item">
                <div><b>チケット再利用率</b> (Lv: <span id="lvRefund">0</span>)</div>
                <div style="color:#666;">スピン時に確率でチケットが戻ります</div>
                <button class="btn-upgrade" id="upRefundBtn">強化 (<span id="costRefund">20</span> C)</button>
            </div>
            <div class="upgrade-item">
                <div><b>幸運のクローバー</b> (Lv: <span id="lvClover">0</span>)</div>
                <div style="color:#666;">🍀が出現しやすくなります</div>
                <button class="btn-upgrade" id="upCloverBtn">強化 (<span id="costClover">25</span> C)</button>
            </div>
        </div>
    </div>

    <div id="btnStatus" style="font-size: 14px; margin-top: 10px; color:#666;">---</div>

    <script>
        const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
        const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

        let bluetoothDevice = null;
        let dataCharacteristic = null;

        // システム状態
        let points = 0;
        let tickets = 0;
        let coins = 0;

        // --- ミッション・ステータス管理 ---
let stage = 1;
let spinsLeft = 5;

let currentMission = {
    text: "",
    type: "",
    targetVal: 0,
    currentVal: 0,
    targetSymbol: null
};
let quota = 50; // データ保存のエラー防止用
let stageEarnedCoins = 0;

// ミッション自動生成関数
function generateMission(stageNum) {
    const types = ['coin', 'align', 'appear', 'upgrade', 'reach'];
    const chosenType = types[Math.floor(Math.random() * types.length)];

    if (chosenType === 'coin') {
        const target = stageNum * 35 + 15;
        return {
            text: `${target} C 稼ぐ`,
            type: 'coin',
            targetVal: target,
            currentVal: 0
        };
    } else if (chosenType === 'align') {
        const syms = ['🍒', '🔔', '🍋'];
        const s = syms[Math.floor(Math.random() * syms.length)];
        return {
            text: `${s} を1回揃える`,
            type: 'align',
            targetSymbol: s,
            targetVal: 1,
            currentVal: 0
        };
    } else if (chosenType === 'appear') {
        const syms = ['🍀', '💎', '7️⃣'];
        const s = syms[Math.floor(Math.random() * syms.length)];
        return {
            text: `${s} を通算2回出す`,
            type: 'appear',
            targetSymbol: s,
            targetVal: 2,
            currentVal: 0
        };
    } else if (chosenType === 'upgrade') {
        return {
            text: `スロットを1回強化する`,
            type: 'upgrade',
            targetVal: 1,
            currentVal: 0
        };
    } else if (chosenType === 'reach') {
        return {
            text: `リーチ(2個一致)を2回出す`,
            type: 'reach',
            targetVal: 2,
            currentVal: 0
        };
    }
}

// ミッション進捗チェック関数
function checkMissionProgress(eventData) {
    // eventData: { type: 'spin', r1, r2, r3, earned } や { type: 'upgrade' }
    if (currentMission.type === 'coin' && eventData.type === 'spin') {
        currentMission.currentVal += eventData.earned;
    } else if (currentMission.type === 'align' && eventData.type === 'spin') {
        if (eventData.r1 === currentMission.targetSymbol && 
            eventData.r2 === currentMission.targetSymbol && 
            eventData.r3 === currentMission.targetSymbol) {
            currentMission.currentVal += 1;
        }
    } else if (currentMission.type === 'appear' && eventData.type === 'spin') {
        let count = 0;
        if (eventData.r1 === currentMission.targetSymbol) count++;
        if (eventData.r2 === currentMission.targetSymbol) count++;
        if (eventData.r3 === currentMission.targetSymbol) count++;
        currentMission.currentVal += count;
    } else if (currentMission.type === 'upgrade' && eventData.type === 'upgrade') {
        currentMission.currentVal += 1;
    } else if (currentMission.type === 'reach' && eventData.type === 'spin') {
        if ((eventData.r1 === eventData.r2 || eventData.r2 === eventData.r3 || eventData.r1 === eventData.r3) &&
            !(eventData.r1 === eventData.r2 && eventData.r2 === eventData.r3)) {
            currentMission.currentVal += 1;
        }
    }
}

        // アニメーション制御用フラグ
        let isSpinning = false;

        let isSessionActive = false;
        let sessionStartTime = null;
        let timerInterval = null;
        let lastPointIntervalCount = 0;

        let upgrades = {
            multiplier: { lv: 1, cost: 10 },
            luck: { lv: 1, cost: 15 },
            refund: { lv: 0, cost: 20 },
            clover: { lv: 0, cost: 25 }
        };

        const symbols = ['🍒', '🔔', '🍋', '7️⃣', '💀', '💎', '🍀'];
        const multipliers = {
            '🍒': 2,
            '🔔': 3,
            '🍋': 5,
            '7️⃣': 10,
            '💀': 0,
            '💎': 15,
            '🍀': 4
        };

        let weights = {
            '🍒': 40,
            '🔔': 30,
            '🍋': 20,
            '7️⃣': 9,
            '💀': 1,
            '💎': 5,
            '🍀': 10
        };

        // DOM要素
        const connectBtn   = document.getElementById('connectBtn');
        const ledOnBtn     = document.getElementById('ledOnBtn');
        const ledOffBtn    = document.getElementById('ledOffBtn');
        const statusDiv    = document.getElementById('status');
        const btnStatusDiv = document.getElementById('btnStatus');
        const pointDisplay = document.getElementById('pointDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        
        const ticketDisplay = document.getElementById('ticketDisplay');
        const coinDisplay   = document.getElementById('coinDisplay');
        const spinBtn       = document.getElementById('spinBtn');
        const slotMsg       = document.getElementById('slotMsg');
        const slotContainer = document.getElementById('slotContainer');
        
        const reel1Div = document.getElementById('reel1');
        const reel2Div = document.getElementById('reel2');
        const reel3Div = document.getElementById('reel3');

        function updateUI() {
            pointDisplay.innerText = `${points} PT`;
            ticketDisplay.innerText = tickets;
            coinDisplay.innerText = coins;

            document.getElementById('stageDisplay').innerText = stage;
            document.getElementById('missionTextDisplay').innerText = currentMission.text;
            document.getElementById('missionProgressDisplay').innerText = `${currentMission.currentVal} / ${currentMission.targetVal}`;
            document.getElementById('spinsLeftDisplay').innerText = spinsLeft;

            // スピン中はボタンを無効化
            spinBtn.disabled = tickets <= 0 || isSpinning;

            document.getElementById('upMultiplierBtn').disabled = coins < upgrades.multiplier.cost || isSpinning;
            document.getElementById('upLuckBtn').disabled = coins < upgrades.luck.cost || isSpinning;
            document.getElementById('upRefundBtn').disabled = coins < upgrades.refund.cost || upgrades.refund.lv >= 5 || isSpinning;
            document.getElementById('upCloverBtn').disabled = coins < upgrades.clover.cost || isSpinning;

            document.getElementById('lvMultiplier').innerText = upgrades.multiplier.lv;
            document.getElementById('costMultiplier').innerText = upgrades.multiplier.cost;
            document.getElementById('lvLuck').innerText = upgrades.luck.lv;
            document.getElementById('costLuck').innerText = upgrades.luck.cost;
            document.getElementById('lvRefund').innerText = upgrades.refund.lv;
            document.getElementById('costRefund').innerText = upgrades.refund.cost;
            document.getElementById('lvClover').innerText = upgrades.clover.lv;
            document.getElementById('costClover').innerText = upgrades.costClover || upgrades.clover.cost;
        }
      function saveGame() {
            const saveData = {
                points: points,
                tickets: tickets,
                coins: coins,
                stage: stage,
                spinsLeft: spinsLeft,
                currentMission: currentMission,
                upgrades: upgrades,
                weights: weights
            };
            localStorage.setItem('m5FocusSlotSave', JSON.stringify(saveData));
        }

        function loadGame() {
            const saved = localStorage.getItem('m5FocusSlotSave');
            if (saved) {
                const saveData = JSON.parse(saved);
                points = saveData.points || 0;
                tickets = saveData.tickets || 0;
                coins = saveData.coins || 0;
                stage = saveData.stage || 1;
                spinsLeft = saveData.spinsLeft !== undefined ? saveData.spinsLeft : 5;
                if (saveData.currentMission) currentMission = saveData.currentMission;
                if (saveData.upgrades) upgrades = Object.assign(upgrades, saveData.upgrades);
                if (saveData.weights) weights = Object.assign(weights, saveData.weights);
                updateUI();
            }
        }

        // BLE 接続処理関連
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "デバイスを探しています...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'M5StickC_Plus2_BLE' }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusDiv.innerText = "接続中...";
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                dataCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await dataCharacteristic.startNotifications();
                dataCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                statusDiv.innerText = "接続完了！";
                ledOnBtn.disabled = false;
                ledOffBtn.disabled = false;
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "エラー: " + error;
            }
        });

        function onDisconnected() {
            statusDiv.innerText = "切断されました！";
            ledOnBtn.disabled = true;
            ledOffBtn.disabled = true;

            if (isSessionActive) {
                applyPenalty("切断ペナルティ");
                stopSession();
            }
        }

        async function sendData(value) {
            if (!dataCharacteristic) return;
            const encoder = new TextEncoder();
            await dataCharacteristic.writeValue(encoder.encode(value));
        }

        ledOnBtn.addEventListener('click', () => sendData('1'));
        ledOffBtn.addEventListener('click', () => sendData('0'));

        function handleNotifications(event) {
            const value = event.target.value.getUint8(0);
            if (value === 1) startSession();
            else if (value === 0) stopSession();
        }

        // 計測ロジック関連
        function startSession() {
            if (isSessionActive) return;
            isSessionActive = true;
            sessionStartTime = Date.now();
            lastPointIntervalCount = 0;
            statusDiv.innerText = "計測中...";
            timerInterval = setInterval(checkSessionProgress, 1000);
        }

        function checkSessionProgress() {
            if (!isSessionActive) return;
            const elapsedSec = Math.floor((Date.now() - sessionStartTime) / 1000);
            
            const minutes = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
            const seconds = String(elapsedSec % 60).padStart(2, '0');
            timerDisplay.innerText = `経過時間: ${minutes}:${seconds}`;

            const INTERVAL = 10;
            const currentIntervalCount = Math.floor(elapsedSec / INTERVAL);

            if (currentIntervalCount > lastPointIntervalCount) {
                const added = (currentIntervalCount - lastPointIntervalCount);
                points += added * 10;
                tickets += added;
                lastPointIntervalCount = currentIntervalCount;
                
                updateUI();
                saveGame();
                btnStatusDiv.innerText = `30分達成！ +10PT & チケット+1枚獲得！`;
            }
        }

        function stopSession() {
            if (!isSessionActive) return;
            isSessionActive = false;
            clearInterval(timerInterval);
            statusDiv.innerText = "計測終了";
            timerDisplay.innerText = "経過時間: 00:00";
            updateUI();
            saveGame();
        }

        function applyPenalty(reason) {
            if (points > 0) points = Math.floor(points / 2);
            btnStatusDiv.innerText = `${reason}: フォーカスPTが半減しました！`;
            updateUI();
            saveGame();
        }

       // --- アニメーション付きスロット処理 ---
spinBtn.addEventListener('click', () => {
    if (tickets <= 0 || isSpinning) return;

    isSpinning = true;
    updateUI();

    const isRefund = Math.random() < (upgrades.refund.lv * 0.1);
    if (!isRefund) {
        tickets--;
    }

    spinsLeft--;

    // 枠の中の文字（.reel-inner）にアニメーションを付与
    reel1Div.classList.add('spinning');
    reel2Div.classList.add('spinning');
    reel3Div.classList.add('spinning');
    slotMsg.innerText = "スピン中...";

    // 結果を先に生成
    const r1 = getRandomSymbol();
    const r2 = getRandomSymbol();
    const r3 = getRandomSymbol();

    // リールを順番に停止させる
    setTimeout(() => {
        reel1Div.classList.remove('spinning');
        reel1Div.innerText = r1;
    }, 600);

    setTimeout(() => {
        reel2Div.classList.remove('spinning');
        reel2Div.innerText = r2;
    }, 1200);

    setTimeout(() => {
        reel3Div.classList.remove('spinning');
        reel3Div.innerText = r3;
        
        // 全リール停止後に結果判定
        processSpinResult(r1, r2, r3, isRefund);
    }, 1800);
});

        function processSpinResult(r1, r2, r3, isRefund) {
            let baseReward = 0;

            if (isRefund) {
                setTimeout(() => { alert("🔁 チケットが手元に戻った！"); }, 100);
            }

            if (r1 === r2 && r2 === r3) {
                baseReward = (multipliers[r1] || 5) * 3;
                if (r1 === '7️⃣') {
                    baseReward *= 2; 
                    slotMsg.innerText = `🔥 777 JACKPOT! 超大当り +${baseReward * upgrades.multiplier.lv} コイン！`;
                    triggerFlash();
                } else if (r1 === '🍀') {
                    tickets += 2;
                    slotMsg.innerText = `🍀 クローバーラッシュ！ +${baseReward * upgrades.multiplier.lv} コイン & チケット+2枚！`;
                } else {
                    slotMsg.innerText = `🎉 【${r1}】大当り！ +${baseReward * upgrades.multiplier.lv} コイン！`;
                }
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                const matchedSymbol = (r1 === r2 || r1 === r3) ? r1 : r2;
                baseReward = multipliers[matchedSymbol] || 2;
                slotMsg.innerText = `👍 リーチ賞！ +${baseReward * upgrades.multiplier.lv} コイン`;
            } else {
                slotMsg.innerText = "ハズレ... また挑戦しよう！";
            }

           const earned = baseReward * upgrades.multiplier.lv;
            coins += earned;

            // --- ミッション進捗を反映 ---
            checkMissionProgress({
                type: 'spin',
                r1: r1,
                r2: r2,
                r3: r3,
                earned: earned
            });

            isSpinning = false;
            checkQuota();
            updateUI();
            saveGame();
        }

        function triggerFlash() {
            slotContainer.classList.add('flash-effect');
            setTimeout(() => {
                slotContainer.classList.remove('flash-effect');
            }, 1500);
        }

   function checkQuota() {
            // ミッション達成判定
            if (currentMission.currentVal >= currentMission.targetVal) {
                setTimeout(() => {
                    alert(`🎉 ミッションクリア！ ボーナスチケット+3枚獲得！`);
                    stage++;
                    spinsLeft = 5;
                    tickets += 3;
                    currentMission = generateMission(stage);
                    updateUI();
                    saveGame();
                }, 500);
            } else if (spinsLeft <= 0) {
                setTimeout(() => {
                    alert(`😭 残りスピンなし... ミッション失敗！ ステージ1からやり直しです。`);
                    stage = 1;
                    spinsLeft = 5;
                    currentMission = generateMission(1);
                    updateUI();
                    saveGame();
                }, 500);
            }
        }
        document.getElementById('upLuckBtn').addEventListener('click', () => {
            if (coins >= upgrades.luck.cost && !isSpinning) {
                coins -= upgrades.luck.cost;
                upgrades.luck.lv++;
                upgrades.luck.cost = Math.floor(upgrades.luck.cost * 1.8);
                checkMissionProgress({ type: 'upgrade' });
                checkQuota();
                updateUI();
                saveGame();
            }
        });

        document.getElementById('upRefundBtn').addEventListener('click', () => {
            if (coins >= upgrades.refund.cost && upgrades.refund.lv < 5 && !isSpinning) {
                coins -= upgrades.refund.cost;
                upgrades.refund.lv++;
                upgrades.refund.cost = Math.floor(upgrades.refund.cost * 2.2);
                checkMissionProgress({ type: 'upgrade' });
                checkQuota();
                updateUI();
                saveGame();
            }
        });

        document.getElementById('upCloverBtn').addEventListener('click', () => {
            if (coins >= upgrades.clover.cost && !isSpinning) {
                coins -= upgrades.clover.cost;
                upgrades.clover.lv++;
                weights['🍀'] += 10;
                upgrades.clover.cost = Math.floor(upgrades.clover.cost * 1.6);
                checkMissionProgress({ type: 'upgrade' });
                checkQuota();
                updateUI();
                saveGame();
            }
        });

        document.getElementById('upLuckBtn').addEventListener('click', () => {
            if (coins >= upgrades.luck.cost && !isSpinning) {
                coins -= upgrades.luck.cost;
                upgrades.luck.lv++;
                upgrades.luck.cost = Math.floor(upgrades.luck.cost * 1.8);
                checkMissionProgress({ type: 'upgrade' });
                checkQuota();
                updateUI();
                saveGame();
            }
        });

        document.getElementById('upRefundBtn').addEventListener('click', () => {
            if (coins >= upgrades.refund.cost && upgrades.refund.lv < 5 && !isSpinning) {
                coins -= upgrades.refund.cost;
                upgrades.refund.lv++;
                upgrades.refund.cost = Math.floor(upgrades.refund.cost * 2.2);
                checkMissionProgress({ type: 'upgrade' });
                checkQuota();
                updateUI();
                saveGame();
            }
        });

        document.getElementById('upCloverBtn').addEventListener('click', () => {
            if (coins >= upgrades.clover.cost && !isSpinning) {
                coins -= upgrades.clover.cost;
                upgrades.clover.lv++;
                weights['🍀'] += 10;
                upgrades.clover.cost = Math.floor(upgrades.clover.cost * 1.6);
                checkMissionProgress({ type: 'upgrade' });
                checkQuota();
                updateUI();
                saveGame();
            }
        });

        function getRandomSymbol() {
            const currentWeights = { ...weights };
            currentWeights['💎'] += (upgrades.luck.lv - 1) * 3;
            currentWeights['🔔'] += (upgrades.luck.lv - 1) * 5;

            let totalWeight = 0;
            for (let s in currentWeights) {
                totalWeight += currentWeights[s];
            }

            let rand = Math.random() * totalWeight;
            for (let s in currentWeights) {
                if (rand < currentWeights[s]) return s;
                rand -= currentWeights[s];
            }
            return '🍒';
        }

    
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

       window.addEventListener('load', () => {
            loadGame();
            if (!currentMission || !currentMission.text) {
                currentMission = generateMission(stage);
            }
            updateUI();
        });
    </script>
